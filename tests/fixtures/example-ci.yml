# Synthetic compatibility fixture; no real repository or deployment configuration.
name: Verify example
on:
  push: {branches: [main]}
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: example
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: example_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U example -d example_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with: {version: "0.13.1"}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22'}
      - run: uv sync --frozen --python 3.13
      - run: npm ci
      - run: uv run ruff check src tests
      - run: uv run pytest -q --cov=example --cov-fail-under=60 --junitxml=test-results.xml
        env:
          TEST_DATABASE_URL: postgresql+psycopg://example:fixture-only@localhost:5432/example_test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
  containers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {role: [api, worker]}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build -f Dockerfile.${{ matrix.role }} -t example-${{ matrix.role }}:test .
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.76.1
          image-ref: example-${{ matrix.role }}:test
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          timeout: 10m
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-results-${{ matrix.role }}
          path: test-results.xml
  secrets:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
