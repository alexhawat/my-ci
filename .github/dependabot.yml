version: 2

# Minor and patch updates are batched into one pull request per ecosystem;
# majors arrive on their own. Dependabot pull requests cannot receive the
# reviewer's API key, so they are gated by CI only (see mergecraft.yml).
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Skip releases younger than a week: most malicious releases are pulled
    # within days.
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]

  # `uv`, not `pip`: the uv updater re-resolves uv.lock in the same pull request.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Skip releases younger than a week: most malicious releases are pulled
    # within days.
    cooldown:
      default-days: 7
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Skip releases younger than a week: most malicious releases are pulled
    # within days.
    cooldown:
      default-days: 7
